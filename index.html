<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="conteudo">
        <header class="conteudo-titulo">
            <img src="unlock.svg" alt="Cadeado" class="icone-cadeado">
            <h1 class="titulo-principal">Gerador de senhas</h1>
            <h2 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h2>
        </header>

        <section class="conteudo-senha">
            <label for="campo-senha">Senha</label>
            <input type="text" id="campo-senha" name="senha" readonly>
            <button id="copiar-senha" class="botao-copiar" type="button">
                Copiar
            </button>
        </section>

        <section class="parametro">
            <h2 class="parametro-titulo">Personalize sua senha</h2>

            <div class="parametro-coluna__senha">

                <div class="parametro-senha">
                    <h3 class="parametro-senha__titulo">
                        Número de caracteres
                    </h3>

                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao"
                            id="diminuir" type="button">-</button>

                        <p class="parametro-senha__texto" id="quantidade">
                            12
                        </p>

                        <button class="parametro-senha__botao"
                            id="aumentar" type="button">+</button>
                    </div>
                </div>

                <fieldset class="parametro-senha">
                    <legend class="parametro-senha__titulo">
                        Características da senha
                    </legend>

                    <label class="opcao">
                        <input type="checkbox" id="maiusculas" checked>
                        Letras maiúsculas
                    </label>

                    <label class="opcao">
                        <input type="checkbox" id="minusculas">
                        Letras minúsculas
                    </label>

                    <label class="opcao">
                        <input type="checkbox" id="numeros">
                        Números
                    </label>

                    <label class="opcao">
                        <input type="checkbox" id="simbolos">
                        Símbolos
                    </label>
                </fieldset>

                <div class="parametro-senha">
                    <h3 class="parametro-senha__titulo">
                        Força da senha
                    </h3>

                    <div class="forca-trilho">
                        <div id="forca-preenchimento"></div>
                    </div>

                    <div class="forca-legendas">
                        <span>Fraca</span>
                        <span>Média</span>
                        <span>Forte</span>
                    </div>

                    <p id="texto-forca" class="texto-forca">Fraca</p>
                </div>

            </div>

            <p id="mensagem" class="mensagem" role="status"></p>

            <button id="gerar-senha" class="botao-gerar" type="button">
                Gerar nova senha
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
